services:
  db:
    image: mysql:8.4
    container_name: todoapp-db
    environment:
      MYSQL_ROOT_PASSWORD: ginior549812
      MYSQL_DATABASE: todoapp
    volumes:
      - todoapp-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pginior549812"]
      interval: 5s
      timeout: 5s
      retries: 10

  server: 
    build:
      context: ./Server
    image: todoapp-server
    container_name: todoapp-server
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./Client
    image: todoapp-client
    container_name: todoapp-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  todoapp-data: